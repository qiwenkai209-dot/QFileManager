name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QFileManager-v1.0.6-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release (on main push / manual trigger)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6-${{ github.run_number }}
          name: "Q管理 v1.0.6 (Build ${{ github.run_number }})"
          body: |
            ### 🚀 Q管理 (QFileManager) 自动构建发布
            
            - **Commit**: ${{ github.sha }}
            - **功能更新**:
              - 🎬 **注册为系统三方媒体播放器与通用文件打开工具**：
                - 在其他 App（微信、QQ、浏览器、下载器、系统文件管理等）点击视频/音频文件时，系统「打开方式」列表中均可选择「Q管理」直接拉起内置 ExoPlayer 专业全屏播放器秒开播放
                - 注册广泛的视频（video/*, mp4, mkv, avi, mov, flv, wmv, m3u8, ts等）、音频（audio/*, mp3, flac, wav, m4a等）及全类型文件匹配规则（*/*）
                - 点击非媒体的其他文件（APK、压缩包、文档等）时，弹出专业外部文件操作面板，支持：强制播放尝试、一键通过 LocalSend 快传、转存导出至本地 Download/QFileManager、APK 一键安装及调用系统打开
              - 🚀 **LocalSend 传输错误与死锁超时问题彻底修复**：
                - 修复 NanoHTTPD 服务端未按 Content-Length 截断导致 HTTP Keep-Alive 下 Socket 无限阻塞超时崩溃问题
                - 修复 NanoHTTPD 在部分设备/大数据包下 postData 存放临时文件路径导致反序列化崩溃的问题
                - 发送端 OkHttp 写超时设为 0（无限制），避免大文件或网络拥塞时被 120 秒超时掐断
                - 增加 Okio 块写入与循环即时 flush，保障数据推入底层 TCP 套接字
                - 增加安全文件名清洗、重名递增保护及公共/私有存储路径回退机制，杜绝写入权限或非法字符异常
                - 传输错误时在 UI 卡片中精准显示具体失败原因（对端拒绝、握手失败、网络中断等）及高亮提示
              - 📡 **LocalSend 局域网发现与被发现功能深度加固**：
                - 彻底修复设备指纹多模块不一致 Bug，全局统一持久化设备指纹
                - 遵循官方 LocalSend v2 协议规范，服务端新增 `/api/localsend/v2/register` 接口与完整 CORS 跨域支持
                - 组播接收增加即时双向回复机制（UDP 单播 + HTTP Register），实现各端毫秒级互相发现
                - 多网卡/热点环境组播出站接口遍历绑定，提升复杂网络与路由器下的发现成功率
              - 🎬 彻底修复重命名后视频文件无法打开的 Bug，增加安全文件名与扩展名自动保护
              - 🔍 文件分类新增「其他文件」分类及全盘实时模糊搜索
              - 📁 新增「打开手机根目录」完整文件浏览器，支持层级面包屑导航、文件夹置顶、新建文件夹、多选批量操作与剪贴板复制剪切粘贴
              - 📱 支持扫描手机安装的所有应用（系统+第三方）
              - 🗑️ 支持一键卸载、清理外部残留数据、一键直达系统清除应用缓存与全部数据
              - 🧹 本机文件与临时垃圾深度清理（相册缩略图、系统临时文件、日志崩溃包、废弃安装包）
              - ⚡ M3U8 离线缓存批量嗅探与秒级无损转 MP4（带实时进度与删除源文件）
              - 🔍 全盘重复文件深度筛查（三阶段高精度流式比对）
              - 🌐 SMB 局域网网络共享（SMB1/2/3、局域网探测、双向断点续传、Range 代理在线播片与多图预览）
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
